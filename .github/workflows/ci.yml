name: ci

# The gate this repository runs locally, run again where it cannot be skipped:
# formatting, the pure-V rule, the build, the prod build, the test suite, the
# links between the documents, and the workflows. `tools/README.md` says what
# each step checks.
#
# The suite is most of the gate's wall time, so it is dealt across three runners:
# `tools/gate.vsh --only tests --shard K/3` runs a third of the test files, and
# the gate job runs `--without tests`, which is every other step by name of what
# it leaves out rather than what it takes, so a step added to the gate later runs
# here without this file being edited. Every check is required, so a shard that
# fails is a red run like any other, and the shards do not cancel each other
# because which files are red is what a failure is read for.
#
# The pinned V is built once and carried in the actions cache: the key is the
# pair of commits below, so a bump misses it, and every job confirms the binary it
# ends up with is the pin's before it compiles anything. Only the gate job saves,
# and only after its own build of the pin, so a failed or half-built toolchain
# cannot reach the cache and answer for the pin afterwards.
#
# The benchmark step in the gate job is recorded rather than gated, because it
# has no number a change can be held to yet: it writes its numbers into the
# run's summary. The self compile beside it gates, because it can pass.
#
# Beside the gate and the three shards, the compliance corpus and the regression
# corpus have a runner each: their cost is a compile per case rather than one test
# suite, and a corpus that fails and a gate that fails are two different answers
# to two different questions.
#
# Nothing runs against V master. This tree promises one compiler, and a job that
# was allowed to fail would be the one nobody reads: a pin that no longer builds
# has to be a red run and a bump, and the pin comment below is what keeps that
# honest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The V this tree is built and tested with, as a commit rather than a release
  # tag on purpose: the 0.5.2 release cannot compile this tree at all. Its
  # checker rejects a `for {}` that returns from every path
  # (parser/parser.v, parse_parameters and parse_arguments), which the compiler
  # after it accepts. V moves quickly, so this is bumped deliberately, with the
  # tree re-verified against the commit it moves to.
  #
  # The floor is u128: parser/literals.v reads a long double's literal through one
  # (0cc8338), and upstream gained u128 and i128 on 2026-10-01. A pin older than
  # that fails the build with `parser/literals.v:448:15: error: unknown function:
  # u128`, and every test file fails behind it.
  #
  # The later floor is the bootstrap, and the snapshot that builds it is pinned
  # beside it. `make` in the V checkout does not use the tree's own compiler:
  # it builds v1 from vlang/vc, a rolling snapshot of master's generated C, and v1
  # is the compiler that reads the pinned source. The snapshot follows master, so
  # a pin is viable only while its source is one that snapshot's compiler still
  # accepts, and that stopped being true on its own: the vc HEAD of 2026-10-28
  # refuses the 2026-10-09 pin at vlib/v/types/vls_hover.v:1388 and every job died
  # at "build V at the pinned commit" without this tree changing at all. The same
  # shape took the 2026-10-01 pin at vlib/math/bits/bits.v:621, where afbe25ce
  # (2026-10-05) made an `if` condition a checker error.
  #
  # So both are pinned, and they move together. `VC_COMMIT` is the snapshot the
  # pin is built with: here bcfdc7f, generated from a60fb589, the commit after this
  # one. Proximity is what makes a pair work rather than any direction, so the pair
  # below is a measurement and not a rule: v1 from that snapshot reads this pin's
  # source, the V it produces passes `v run tools/gate.vsh`, and the snapshot of
  # a6826c4, 98961dd, does not read this source at all. The build step clones the
  # snapshot through a local mirror whose master is the pinned commit, so make's
  # own `pull` cannot carry it past the pin. Both values are named in the three
  # workflows and the Dockerfile, and `tools/gate.vsh` refuses a set that disagrees.
  #
  # The pin is not V master, and cannot be: master refuses this tree at
  # ast/ast.v:1051, a sum type field that closes a cycle without a reference, so
  # moving there is a change to this tree rather than a bump.
  V_COMMIT: c6bb06f5c04d78f9f6d22a57c257d27e835ba40a
  VC_COMMIT: bcfdc7f33e7b7908ee40f76d059c0e2894fb4a3b
  V_DIR: /opt/v

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # The self compile step below builds this tree a second time, so the job now
    # carries that cost on top of the gate's.
    timeout-minutes: 30
    # The tests badge in README.md reads a number this job computes, so this job
    # needs to write. Everything else in the workflow is read-only, and a pull
    # request from a fork gets a read-only token whatever this says, which is why
    # the step that writes is guarded to a push on main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The toolchain, from the cache when a run with this pair of commits has
      # already built it: every job needs it, and building it is about six minutes
      # of a two-core runner.
      - name: restore the pinned V
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.V_DIR }}
          key: v-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}

      - name: build V at the pinned commit
        id: build
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --quiet https://github.com/vlang/v "$V_DIR"
          git -C "$V_DIR" checkout --quiet "$V_COMMIT"
          # The bootstrap snapshot, cloned through a mirror whose master is the
          # pinned commit. make's own update step pulls from that mirror, so the
          # snapshot stays where it is; cloning vlang/vc directly would leave the
          # pull pointing at the rolling HEAD, which is what refuses the pinned
          # source and takes every job down with it.
          git clone --quiet https://github.com/vlang/vc "$(dirname "$V_DIR")/vc-pinned"
          git -C "$(dirname "$V_DIR")/vc-pinned" checkout --quiet -B master "$VC_COMMIT"
          git clone --quiet "$(dirname "$V_DIR")/vc-pinned" "$V_DIR/vc"
          make -C "$V_DIR"

      # Only this job writes the cache, so two runners cannot race for one key,
      # and only after its own build of the pin, so what is saved is a toolchain
      # that built. `always()` is what lets a run whose gate step failed still
      # leave a good toolchain behind: the pin is not the tree.
      - name: save the pinned V
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.V_DIR }}
          key: v-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}

      # The version string carries the commit `v` was built from, so this is where
      # a restored toolchain is held to the pin rather than assumed to be it.
      - name: put V on PATH
        run: |
          echo "$V_DIR" >> "$GITHUB_PATH"
          # The version string carries the commit `v` was built from. A `case`
          # rather than `| grep -q`, because grep leaves as soon as it matches and
          # the runner's bash has pipefail on, which would read a SIGPIPE from the
          # producer as a wrong toolchain.
          version="$("$V_DIR/v" version)"
          echo "$version"
          case "$version" in
            *"${V_COMMIT:0:7}"*) ;;
            *)
              echo "the V at $V_DIR is not the pinned commit ${V_COMMIT:0:7}"
              exit 1
              ;;
          esac

      # Every step but the tests: the suite has the three runners of the `tests`
      # job below, and running it here as well would pay for it twice. Named as
      # `--without` so a step added to gate.vsh runs here without this file
      # changing; a step left out of CI is a check nobody meets until a merge.
      - name: gate
        run: |
          v version
          v run tools/gate.vsh --without tests

      # The self-compile: this tree built by this tree, which is the first link
      # of the bootstrap chain. `v . -o vcc1` builds the compiler with V, and
      # `v . -cc vcc1 -o vcc` asks V for the same C again and hands it to the
      # compiler it just built, so vcc has to read and emit the C V writes for
      # it, about 110,000 lines of it, and the binary it produces has to run.
      #
      # This gates. It was recorded rather than gated until the refusal it named
      # was fixed: a declarator written after one whose initializer holds a cast
      # was given the cast's type, so `unsigned long lb` read as `unsigned int`
      # and the product it appears in was refused at src.c:6166 with
      # `unsupported: * takes int operands, and this one is a pointer`. The
      # parser gives that specifier state back now, so a change that stops this
      # compiler reading its own C fails here instead of quietly narrowing what
      # it can build.
      - name: self compile
        run: |
          work="$(mktemp -d)"
          v . -o "$work/vcc1"
          "$work/vcc1" --version
          if ! v . -cc "$work/vcc1" -o "$work/vcc" > "$work/log" 2>&1; then
            echo 'this tree could not read the C V writes for it; the tail of the attempt:'
            # Mostly V's notices about other people's source, each three lines
            # of quoted context, so the context lines go and the rest stays.
            grep -vE '^ *[0-9]+ \||^ *\|' "$work/log" | tail -25
            exit 1
          fi
          "$work/vcc" --version

      # The tests badge in README.md reads a number this job computes, from the
      # tool that counts the suite rather than a second glob that can drift from
      # it. A push made with GITHUB_TOKEN does not start another workflow run, so
      # this cannot loop.
      - name: keep the tests badge current
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          count=$(v run tools/tests.vsh --count)
          file=.github/badges/tests.json
          printf '{"tests": %s}\n' "$count" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then
            echo "the badge already reads ${count} tests"
            exit 0
          fi
          git commit --quiet -m "docs: the badge reads ${count} tests"
          # The remote can move while this job runs: another push, or one of the
          # other badge jobs finishing first. The two commands share a line so a
          # rejected rebase cannot push a stale badge as though it were current.
          # `origin main` is named rather than a bare pull because a detached
          # HEAD has no branch to merge into, and HEAD:main rather than a bare
          # push because checkout can leave a detached HEAD on some events.
          git pull --rebase --quiet origin main && git push origin HEAD:main

      # The lines badge in README.md reads this, from the tool the count has one
      # home in. It is a walk over the tracked files, so it costs nothing beside
      # the gate, and it carries its own commit for the same reason the ones
      # above do.
      - name: keep the lines badge current
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          count=$(v run tools/lines.vsh --count)
          file=.github/badges/lines.json
          printf '{"lines": %s}\n' "$count" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then
            echo "the badge already reads ${count} lines"
            exit 0
          fi
          git commit --quiet -m "docs: the badge reads ${count} lines"
          # The remote can move while this job runs: another push, or one of the
          # other badge jobs finishing first. The two commands share a line so a
          # rejected rebase cannot push a stale badge as though it were current.
          # `origin main` is named rather than a bare pull because a detached
          # HEAD has no branch to merge into, and HEAD:main rather than a bare
          # push because checkout can leave a detached HEAD on some events.
          git pull --rebase --quiet origin main && git push origin HEAD:main

      # The numbers are recorded, not gated. A shared runner's wall time is not
      # a budget anyone can hold a pull request to, and the workload that will
      # decide this project is the V self-build, which no milestone reaches yet
      # (ROADMAP M6). Until then the point is that the harness runs and the
      # number is written down somewhere other than a terminal.
      - name: benchmark
        continue-on-error: true
        run: |
          {
            echo '### benchmark on this runner'
            echo '```'
            v run tools/bench.vsh --terms 20000 --runs 3 2>&1 || echo 'the harness could not run'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The test suite, in three parts, because it is most of what the gate job used
  # to wait for. `--shard K/3` deals the tree's test files into three groups and
  # runs the Kth of them, so the three runners together run every file once. The
  # deal is computed by the gate from the files themselves rather than listed
  # here, so a test file added anywhere is in exactly one group without this file
  # changing.
  tests:
    name: tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A failing shard fails this check; the others still finish, because which
      # files are red is what a failure is read for.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: restore the pinned V
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.V_DIR }}
          key: v-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}

      # No save here: the gate job owns the key, so three runners starting
      # together do not race for it. A miss only costs this job its own build, and
      # the next run takes the toolchain from the cache.
      - name: build V at the pinned commit
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --quiet https://github.com/vlang/v "$V_DIR"
          git -C "$V_DIR" checkout --quiet "$V_COMMIT"
          # The bootstrap snapshot, cloned through a mirror whose master is the
          # pinned commit. make's own update step pulls from that mirror, so the
          # snapshot stays where it is; cloning vlang/vc directly would leave the
          # pull pointing at the rolling HEAD, which is what refuses the pinned
          # source and takes every job down with it.
          git clone --quiet https://github.com/vlang/vc "$(dirname "$V_DIR")/vc-pinned"
          git -C "$(dirname "$V_DIR")/vc-pinned" checkout --quiet -B master "$VC_COMMIT"
          git clone --quiet "$(dirname "$V_DIR")/vc-pinned" "$V_DIR/vc"
          make -C "$V_DIR"

      - name: put V on PATH
        run: |
          echo "$V_DIR" >> "$GITHUB_PATH"
          # The version string carries the commit `v` was built from. A `case`
          # rather than `| grep -q`, because grep leaves as soon as it matches and
          # the runner's bash has pipefail on, which would read a SIGPIPE from the
          # producer as a wrong toolchain.
          version="$("$V_DIR/v" version)"
          echo "$version"
          case "$version" in
            *"${V_COMMIT:0:7}"*) ;;
            *)
              echo "the V at $V_DIR is not the pinned commit ${V_COMMIT:0:7}"
              exit 1
              ;;
          esac

      - name: test suite, shard ${{ matrix.shard }} of 3
        run: v run tools/gate.vsh --only tests --shard ${{ matrix.shard }}/3

  # The one check that measures this compiler against a C library rather than
  # against its own tests: the corpus under compliance/ is one small test per
  # answer, in a directory per C standard, and each one is compiled and run on
  # its own under the standard of the directory it sits in. It has a runner to
  # itself because its cost is a thousand compiles rather than one test suite,
  # and because a corpus that fails and a gate that fails are two different
  # answers to two different questions. The price is a second build of the same
  # pinned V; the pin itself is in one place, above.
  compliance:
    name: compliance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The badge in README.md reads a number this job computes, so this job needs
    # to write. Everything else in the workflow is read-only, and a pull request
    # from a fork gets a read-only token whatever this says, which is why the step
    # that writes is guarded to a push on main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: restore the pinned V
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.V_DIR }}
          key: v-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}

      - name: build V at the pinned commit
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --quiet https://github.com/vlang/v "$V_DIR"
          git -C "$V_DIR" checkout --quiet "$V_COMMIT"
          # The bootstrap snapshot, cloned through a mirror whose master is the
          # pinned commit. make's own update step pulls from that mirror, so the
          # snapshot stays where it is; cloning vlang/vc directly would leave the
          # pull pointing at the rolling HEAD, which is what refuses the pinned
          # source and takes every job down with it.
          git clone --quiet https://github.com/vlang/vc "$(dirname "$V_DIR")/vc-pinned"
          git -C "$(dirname "$V_DIR")/vc-pinned" checkout --quiet -B master "$VC_COMMIT"
          git clone --quiet "$(dirname "$V_DIR")/vc-pinned" "$V_DIR/vc"
          make -C "$V_DIR"

      - name: put V on PATH
        run: |
          echo "$V_DIR" >> "$GITHUB_PATH"
          # The version string carries the commit `v` was built from. A `case`
          # rather than `| grep -q`, because grep leaves as soon as it matches and
          # the runner's bash has pipefail on, which would read a SIGPIPE from the
          # producer as a wrong toolchain.
          version="$("$V_DIR/v" version)"
          echo "$version"
          case "$version" in
            *"${V_COMMIT:0:7}"*) ;;
            *)
              echo "the V at $V_DIR is not the pinned commit ${V_COMMIT:0:7}"
              exit 1
              ;;
          esac

      # The script builds the compiler from this tree itself, so the only thing
      # this job has to get right is which `v` is on PATH.
      - name: compliance corpus
        run: v run tools/compliance.vsh

      # The one thing a run can write back: the number of tests in the corpus,
      # read by the badge in README.md. It comes from the runner's own file
      # collection rather than from a second glob, so the badge cannot disagree
      # with what actually runs. A push made with GITHUB_TOKEN does not start
      # another workflow run, so this cannot loop.
      - name: keep the badge count current
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          count=$(v run tools/compliance.vsh --count)
          file=.github/badges/compliance-tests.json
          printf '{"tests": %s}\n' "$count" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then
            echo "the badge already reads ${count} tests"
            exit 0
          fi
          git commit --quiet -m "docs: the badge reads ${count} compliance tests"
          # The remote can move while this job runs: another push, or one of the
          # other badge jobs finishing first. The two commands share a line so a
          # rejected rebase cannot push a stale badge as though it were current.
          # `origin main` is named rather than a bare pull because a detached
          # HEAD has no branch to merge into, and HEAD:main rather than a bare
          # push because checkout can leave a detached HEAD on some events.
          git pull --rebase --quiet origin main && git push origin HEAD:main

  # The regression corpus: one C program per bug this compiler has already put
  # right, and one golden program per answer whose exact stdout must not move.
  # Each case is compiled and run on its own. It has a runner to itself for the
  # same reason the compliance corpus does: its cost is a compile and a run per
  # case rather than one test suite, and a corpus that regresses and a gate that
  # fails are two different answers to two different questions. The price is a
  # third build of the same pinned V; the pin itself is in one place, above.
  regressions:
    name: regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The badge in README.md reads a number this job computes, so this job needs
    # to write. Everything else in the workflow is read-only, and a pull request
    # from a fork gets a read-only token whatever this says, which is why the step
    # that writes is guarded to a push on main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: restore the pinned V
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.V_DIR }}
          key: v-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}

      - name: build V at the pinned commit
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --quiet https://github.com/vlang/v "$V_DIR"
          git -C "$V_DIR" checkout --quiet "$V_COMMIT"
          # The bootstrap snapshot, cloned through a mirror whose master is the
          # pinned commit. make's own update step pulls from that mirror, so the
          # snapshot stays where it is; cloning vlang/vc directly would leave the
          # pull pointing at the rolling HEAD, which is what refuses the pinned
          # source and takes every job down with it.
          git clone --quiet https://github.com/vlang/vc "$(dirname "$V_DIR")/vc-pinned"
          git -C "$(dirname "$V_DIR")/vc-pinned" checkout --quiet -B master "$VC_COMMIT"
          git clone --quiet "$(dirname "$V_DIR")/vc-pinned" "$V_DIR/vc"
          make -C "$V_DIR"

      - name: put V on PATH
        run: |
          echo "$V_DIR" >> "$GITHUB_PATH"
          # The version string carries the commit `v` was built from. A `case`
          # rather than `| grep -q`, because grep leaves as soon as it matches and
          # the runner's bash has pipefail on, which would read a SIGPIPE from the
          # producer as a wrong toolchain.
          version="$("$V_DIR/v" version)"
          echo "$version"
          case "$version" in
            *"${V_COMMIT:0:7}"*) ;;
            *)
              echo "the V at $V_DIR is not the pinned commit ${V_COMMIT:0:7}"
              exit 1
              ;;
          esac

      # The script builds the compiler from this tree itself, so the only thing
      # this job has to get right is which `v` is on PATH. The run's summary is
      # kept in a file because the badge step below reads its failure count.
      - name: regression corpus
        run: |
          set -o pipefail
          v run tools/regress.vsh 2>&1 | tee "$RUNNER_TEMP/regress.log"

      # The two numbers the regressions badge in README.md carries: the case
      # count, read from the runner's own file collection rather than from a
      # second glob, and the number of cases the run just failed, read from its
      # summary line. The badge counts failing cases (regression/README.md), so
      # this step runs even when the corpus above failed; the job is still red,
      # and the badge records the failure instead of the run hiding it. A push
      # made with GITHUB_TOKEN does not start another workflow run, so this
      # cannot loop.
      - name: keep the regressions badge current
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          count=$(v run tools/regress.vsh --count)
          failed=$(grep -oE '[0-9]+ failed' "$RUNNER_TEMP/regress.log" 2>/dev/null | grep -oE '[0-9]+' | head -1)
          file=.github/badges/regressions.json
          printf '{"tests": %s, "failed": %s}\n' "$count" "${failed:-0}" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then
            echo "the badge already reads ${count} cases, ${failed:-0} failing"
            exit 0
          fi
          git commit --quiet -m "docs: the badge reads ${count} cases, ${failed:-0} failing"
          # The remote can move while this job runs: another push, or one of the
          # other badge jobs finishing first. The two commands share a line so a
          # rejected rebase cannot push a stale badge as though it were current.
          # `origin main` is named rather than a bare pull because a detached
          # HEAD has no branch to merge into, and HEAD:main rather than a bare
          # push because checkout can leave a detached HEAD on some events.
          git pull --rebase --quiet origin main && git push origin HEAD:main
