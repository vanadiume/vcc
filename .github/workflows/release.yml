name: release

# A release is automatic, and v.mod decides when. Every push to main reads the
# version v.mod names; if no release carries that version yet, the compiler and
# its runtime archive are built, put through the same gate a pull request goes
# through, run once, staged as /usr/bin/vcc and /usr/lib/libvcc.a, and attached
# as one tarball. A push whose v.mod version already has a release does nothing,
# so the way to cut a release is to bump the version in v.mod and merge. v.mod is
# the single source: the tag, the release title and the binary's `--version` all
# come from it, and a compiler that reports the wrong version is one V will key
# its cached builds against incorrectly (see Compatibility in README.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time: two pushes close together must not both find the
# version unreleased and race to publish it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  V_COMMIT: c6bb06f5c04d78f9f6d22a57c257d27e835ba40a
  # The vlang/vc snapshot that builds that commit; the two are bumped together.
  # `.github/workflows/ci.yml` says why the snapshot is pinned.
  VC_COMMIT: bcfdc7f33e7b7908ee40f76d059c0e2894fb4a3b
  V_DIR: /opt/v
  # libvcc is the runtime archive every program that reaches a helper links
  # against, and the release carries it beside the compiler. It is pinned for the
  # same reason V is: a release is built from commits, not from whatever the two
  # repositories held that morning.
  LIBVCC_REPO: https://github.com/vanadiume/libvcc
  LIBVCC_COMMIT: cf3f6624e7a7dfe895a88c262df82014c2b25de5

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - name: read the version v.mod names
        id: read
        run: |
          version="$(sed -n "s/^[[:space:]]*version:[[:space:]]*'\([^']*\)'.*/\1/p" v.mod | head -n 1)"
          if [ -z "$version" ]; then
            echo "v.mod names no version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: is that version released already
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.read.outputs.tag }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: release
    needs: version
    if: needs.version.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: build V at the pinned commit
        run: |
          git clone --quiet https://github.com/vlang/v "$V_DIR"
          git -C "$V_DIR" checkout --quiet "$V_COMMIT"
          git clone --quiet https://github.com/vlang/vc "$(dirname "$V_DIR")/vc-pinned"
          git -C "$(dirname "$V_DIR")/vc-pinned" checkout --quiet -B master "$VC_COMMIT"
          git clone --quiet "$(dirname "$V_DIR")/vc-pinned" "$V_DIR/vc"
          make -C "$V_DIR"
          echo "$V_DIR" >> "$GITHUB_PATH"
          "$V_DIR/v" version

      - name: gate
        run: v run tools/gate.vsh

      - name: the binary agrees with v.mod
        run: |
          v -gc none -o vcc .
          built="$(./vcc --version | awk '{print $2}')"
          if [ "$built" != "${{ needs.version.outputs.version }}" ]; then
            echo "v.mod names ${{ needs.version.outputs.version }} and the binary answered ${built}" >&2
            exit 1
          fi

      - name: the binary does what it says
        run: |
          # In a directory of its own, because a step that dies midway must not
          # leave a C file in the tree: the gate rejects one, and a release that
          # pollutes the checkout it is releasing fails for the wrong reason.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf 'int main() { return 7; }\n' > "$work/seven.c"
          ./vcc "$work/seven.c" -o "$work/seven"
          # A step runs under `bash -e`, so running the program directly would end
          # the step with its status, and the status is the thing being checked.
          if "$work/seven"; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 7 ]; then
            echo "the compiled program exited ${status}, and its source says 7" >&2
            exit 1
          fi

      - name: package the compiler and its runtime archive
        run: |
          # Both files come out of this run: the compiler from this tree, the
          # archive from libvcc built by that compiler. The install step proves
          # the pair by linking a program against a helper only the archive
          # defines before the tarball is written.
          git clone --quiet "$LIBVCC_REPO" "$RUNNER_TEMP/libvcc"
          git -C "$RUNNER_TEMP/libvcc" checkout --quiet "$LIBVCC_COMMIT"
          v run tools/build.vsh install \
            --prefix "$RUNNER_TEMP/stage/usr" \
            --libvcc "$RUNNER_TEMP/libvcc"
          stem="vcc-${{ needs.version.outputs.version }}-x86_64-linux"
          # Sorted, owned by root and stamped at the epoch, so the same tree
          # packs to the same bytes.
          tar --create --gzip --file "$RUNNER_TEMP/${stem}.tar.gz" \
            --directory "$RUNNER_TEMP/stage" \
            --owner=0 --group=0 --numeric-owner --mtime=@0 --sort=name \
            usr
          (cd "$RUNNER_TEMP" && sha256sum "${stem}.tar.gz" > "${stem}.tar.gz.sha256")

      - name: the tarball holds a compiler that links against the archive beside it
        run: |
          stem="vcc-${{ needs.version.outputs.version }}-x86_64-linux"
          root="$RUNNER_TEMP/extract"
          mkdir -p "$root"
          tar --extract --gzip --file "$RUNNER_TEMP/${stem}.tar.gz" --directory "$root"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf 'long long __divdi3(long long, long long);\nint main(void) { return (int)__divdi3(84, 2); }\n' > "$work/helper.c"
          # Untarred under a temporary root, the archive is not in a directory
          # this run searches, so -L stands in for the /usr/lib the tarball
          # installs to. The program exits with the quotient, 84 / 2.
          "$root/usr/bin/vcc" "$work/helper.c" -L "$root/usr/lib" -o "$work/helper"
          if "$work/helper"; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 42 ]; then
            echo "the packaged compiler linked a program that exited ${status}, and its helper divides 84 by 2" >&2
            exit 1
          fi
          answer="$("$root/usr/bin/vcc" --version | awk '{print $2}')"
          if [ "$answer" != "${{ needs.version.outputs.version }}" ]; then
            echo "v.mod names ${{ needs.version.outputs.version }} and the packaged binary answered ${answer}" >&2
            exit 1
          fi

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stem="vcc-${{ needs.version.outputs.version }}-x86_64-linux"
          gh release create "${{ needs.version.outputs.tag }}" \
            "$RUNNER_TEMP/${stem}.tar.gz" "$RUNNER_TEMP/${stem}.tar.gz.sha256" \
            --title "${{ needs.version.outputs.tag }}" \
            --target "${GITHUB_SHA}" \
            --generate-notes
