name: release

# A release is automatic, and v.mod decides when. A push to main runs ci on the
# commit it landed, and this workflow starts where ci finishes: when that run
# completes green, it reads the version v.mod names at that commit, and if no
# release carries that version yet, the compiler and its runtime are built, put
# through the checks a tarball can fail, staged as /usr/bin/vcc with
# /usr/lib/libvcc.a and the libvcc.so chain beside it, and attached as one
# tarball. A push whose v.mod version already has a release does nothing, so the
# way to cut a release is to bump the version in v.mod and merge. v.mod is the
# single source: the tag, the release title and the binary's `--version` all come
# from it, and a compiler that reports the wrong version is one V will key its
# cached builds against incorrectly (see Compatibility in README.md).
#
# The gate is not run again here. It used to be: this job ran
# `v run tools/gate.vsh` on a runner of its own, which is the suite ci had just
# sharded across three, and it was twelve of the twenty minutes the job took.
# Starting from ci's result is a precondition and not a copy, and a stronger one,
# because this workflow cannot begin unless that run finished green. It also
# checks out the commit ci was given rather than the head of main, because ci's
# own badge steps push to main while the run is still going.
#
# A manual dispatch is the one path with no ci run behind it, so it runs the gate
# itself before it packages anything.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time: two ci runs finishing close together must not both
# find the version unreleased and race to publish it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  V_COMMIT: c6bb06f5c04d78f9f6d22a57c257d27e835ba40a
  # The vlang/vc snapshot that builds that commit; the two are bumped together.
  # `.github/workflows/ci.yml` says why the snapshot is pinned.
  VC_COMMIT: bcfdc7f33e7b7908ee40f76d059c0e2894fb4a3b
  V_DIR: /opt/v
  # libvcc is the runtime every program that reaches a helper links against, and
  # the release carries both the archive and the shared library beside the
  # compiler. It is pinned for the same reason V is: a release is built from
  # commits, not from whatever the two repositories held that morning. The pin
  # has to name a commit whose archive answers the complex helpers, because the
  # compiler emits calls to them for a complex product and quotient.
  LIBVCC_REPO: https://github.com/vanadiume/libvcc
  LIBVCC_COMMIT: f41e169a4d2e247fb132c4d7bb63dea0791b91b5

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    # Only a push to main that ci passed can be released. A pull request's run is
    # a run of code nobody merged, and a red or cancelled run is not a tree to
    # ship; `event == 'push'` keeps a fork's pull request branch named main from
    # matching the workflow name above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit ci was given, which is not necessarily the head of main:
          # the gate job's badge steps push to main before its run ends. A
          # dispatch has no run behind it and takes the branch it was started on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: read the version v.mod names
        id: read
        run: |
          version="$(sed -n "s/^[[:space:]]*version:[[:space:]]*'\([^']*\)'.*/\1/p" v.mod | head -n 1)"
          if [ -z "$version" ]; then
            echo "v.mod names no version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: is that version released already
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.read.outputs.tag }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: release
    needs: version
    if: needs.version.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The toolchain, from the cache the run this one follows already filled:
      # ci's gate job builds the pin and saves it before its own gate step, and
      # this job starts after that run ended, so the usual path is a restore and
      # no build at all. A dispatch has nobody to take it from and builds it,
      # which is the seven minutes that path still pays.
      - name: restore the pinned V
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.V_DIR }}
          key: v-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}

      - name: build V at the pinned commit
        id: build
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --quiet https://github.com/vlang/v "$V_DIR"
          git -C "$V_DIR" checkout --quiet "$V_COMMIT"
          # The bootstrap snapshot, cloned through a mirror whose master is the
          # pinned commit. make's own update step pulls from that mirror, so the
          # snapshot stays where it is; cloning vlang/vc directly would leave the
          # pull pointing at the rolling HEAD, which is what refuses the pinned
          # source and takes every job down with it.
          git clone --quiet https://github.com/vlang/vc "$(dirname "$V_DIR")/vc-pinned"
          git -C "$(dirname "$V_DIR")/vc-pinned" checkout --quiet -B master "$VC_COMMIT"
          git clone --quiet "$(dirname "$V_DIR")/vc-pinned" "$V_DIR/vc"
          make -C "$V_DIR"

      # Only a run that built the pin saves it. Losing the key to a ci run that
      # started beside this one costs nothing, since the restore above is what
      # every later run reads, so the failure is not worth a red release.
      - name: save the pinned V
        if: steps.toolchain.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.V_DIR }}
          key: v-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}

      # The version string carries the commit `v` was built from, so this is where
      # a restored toolchain is held to the pin rather than assumed to be it.
      - name: put V on PATH
        run: |
          echo "$V_DIR" >> "$GITHUB_PATH"
          # A `case` rather than `| grep -q`, because grep leaves as soon as it
          # matches and the runner's bash has pipefail on, which would read a
          # SIGPIPE from the producer as a wrong toolchain.
          version="$("$V_DIR/v" version)"
          echo "$version"
          case "$version" in
            *"${V_COMMIT:0:7}"*) ;;
            *)
              echo "the V at $V_DIR is not the pinned commit ${V_COMMIT:0:7}"
              exit 1
              ;;
          esac

      # No ci run stands behind a dispatch, so that path runs the gate itself.
      # Every step below this one checks the artifact rather than the tree.
      - name: gate
        if: github.event_name == 'workflow_dispatch'
        run: v run tools/gate.vsh

      - name: the binary agrees with v.mod
        run: |
          v -gc none -o vcc .
          built="$(./vcc --version | awk '{print $2}')"
          if [ "$built" != "${{ needs.version.outputs.version }}" ]; then
            echo "v.mod names ${{ needs.version.outputs.version }} and the binary answered ${built}" >&2
            exit 1
          fi

      - name: the binary does what it says
        run: |
          # In a directory of its own, because a step that dies midway must not
          # leave a C file in the tree: the gate rejects one, and a release that
          # pollutes the checkout it is releasing fails for the wrong reason.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf 'int main() { return 7; }\n' > "$work/seven.c"
          ./vcc "$work/seven.c" -o "$work/seven"
          # A step runs under `bash -e`, so running the program directly would end
          # the step with its status, and the status is the thing being checked.
          if "$work/seven"; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 7 ]; then
            echo "the compiled program exited ${status}, and its source says 7" >&2
            exit 1
          fi

      - name: package the compiler and its runtime archive
        run: |
          # Both files come out of this run: the compiler from this tree, the
          # archive from libvcc built by that compiler. The install step proves
          # the pair by linking a program against a helper only the archive
          # defines before the tarball is written.
          git clone --quiet "$LIBVCC_REPO" "$RUNNER_TEMP/libvcc"
          git -C "$RUNNER_TEMP/libvcc" checkout --quiet "$LIBVCC_COMMIT"
          v run tools/build.vsh install \
            --prefix "$RUNNER_TEMP/stage/usr" \
            --libvcc "$RUNNER_TEMP/libvcc"
          stem="vcc-${{ needs.version.outputs.version }}-x86_64-linux"
          # Sorted, owned by root and stamped at the epoch, so the same tree
          # packs to the same bytes.
          tar --create --gzip --file "$RUNNER_TEMP/${stem}.tar.gz" \
            --directory "$RUNNER_TEMP/stage" \
            --owner=0 --group=0 --numeric-owner --mtime=@0 --sort=name \
            usr
          (cd "$RUNNER_TEMP" && sha256sum "${stem}.tar.gz" > "${stem}.tar.gz.sha256")

      - name: the tarball holds a compiler that links against the runtime beside it
        run: |
          stem="vcc-${{ needs.version.outputs.version }}-x86_64-linux"
          root="$RUNNER_TEMP/extract"
          mkdir -p "$root"
          tar --extract --gzip --file "$RUNNER_TEMP/${stem}.tar.gz" --directory "$root"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf 'long long __divdi3(long long, long long);\nint main(void) { return (int)__divdi3(84, 2); }\n' > "$work/helper.c"
          # Untarred under a temporary root, the archive is not in a directory
          # this run searches, so -L stands in for the /usr/lib the tarball
          # installs to. The program exits with the quotient, 84 / 2.
          "$root/usr/bin/vcc" "$work/helper.c" -L "$root/usr/lib" -o "$work/helper"
          if "$work/helper"; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 42 ]; then
            echo "the packaged compiler linked a program that exited ${status}, and its helper divides 84 by 2" >&2
            exit 1
          fi
          # The shared runtime is the other half. A program linked with
          # -shared-libvcc records the library's soname rather than the name it
          # was linked through, so the loader's path names the extracted lib
          # directory and the run proves the soname resolves there.
          printf 'double _Complex __muldc3(double, double, double, double);\nint main(void) { double _Complex z = __muldc3(1.0, 2.0, 3.0, 4.0); return (int)__real__ z + 5; }\n' > "$work/shared.c"
          "$root/usr/bin/vcc" "$work/shared.c" -L "$root/usr/lib" -shared-libvcc -o "$work/shared"
          if LD_LIBRARY_PATH="$root/usr/lib" "$work/shared"; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            echo "the packaged compiler linked a -shared-libvcc program that exited ${status}, and its helper multiplies (1+2i)(3+4i)" >&2
            exit 1
          fi
          answer="$("$root/usr/bin/vcc" --version | awk '{print $2}')"
          if [ "$answer" != "${{ needs.version.outputs.version }}" ]; then
            echo "v.mod names ${{ needs.version.outputs.version }} and the packaged binary answered ${answer}" >&2
            exit 1
          fi

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stem="vcc-${{ needs.version.outputs.version }}-x86_64-linux"
          # The tag points at the commit ci passed, not at whatever main holds
          # now: the badge steps push while a run is going, so the head of main
          # can be a commit no job has tested yet.
          gh release create "${{ needs.version.outputs.tag }}" \
            "$RUNNER_TEMP/${stem}.tar.gz" "$RUNNER_TEMP/${stem}.tar.gz.sha256" \
            --title "${{ needs.version.outputs.tag }}" \
            --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --generate-notes
